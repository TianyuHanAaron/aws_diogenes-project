[project]
name = "diogenes_sunlight_post"
version = "0.1.0"
description = "Diogenes Sunlight Post email digest powered by CrewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[bedrock,tools]==1.10.1",
    "pydantic==2.11.10",
    "requests>=2.32.0,<3",
    "boto3>=1.39.0,<2",
    "feedparser>=6.0.12,<7",
    "python-dotenv>=1.0.1,<2",
    "PyYAML>=6.0.2,<7",
    "questionary>=2.1.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
kickoff = "main:kickoff_email_flow"
run_crew = "main:kickoff_email_flow"
run_email_flow = "main:run_email_flow"
run_cli = "cli.app:run_cli"
plot = "main:plot"
run_with_trigger = "main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "pyproject.toml", "requirements.txt"]

[tool.crewai]
type = "flow"
