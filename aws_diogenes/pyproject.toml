[project]
name = "aws_diogenes"
version = "0.1.0"
description = "aws_diogenes using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[bedrock,tools]==1.10.1",
    "pydantic==2.11.10",
    "requests>=2.32.0,<3",
    "boto3>=1.39.0,<2",
]

[project.scripts]
kickoff = "main:kickoff"
run_crew = "main:kickoff"
plot = "main:plot"
run_with_trigger = "main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
