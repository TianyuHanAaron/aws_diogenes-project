  verify_contact_task:
    description: >
      Check whether the author of a social media post matches any trusted contact
      provided in the trusted_contacts input. Trusted contacts may include friends, relatives,
      colleagues, employers, or official company accounts. Use exact handle or ID
      matching. If the author is not in the trusted list, mark the post as untrusted.
    expected_output: >
      JSON object indicating verification result.

      Example:
      {
        "trusted": true,
        "author": "@alice"
      }
    agent: post_identity_agent


  summarize_post_task:
    description: >
      Summarize the verified social media post into a short neutral message suitable
      for SMS delivery. Preserve the main information while removing informal wording,
      emojis, or emotional tone. The message must remain factual and under 30 words.
    expected_output: >
      A concise SMS-ready message.

      Example:
      "Alice announced she will move to Singapore next month for a new job."
      "Bob shared a photo of his recent dining experience at a local restaurant."
    agent: post_summary_agent
    context:
    - verify_contact_task
 
