seasonal_event_detection_task:
  description: >
    Use the provided `seasonal_events` input that has already been collected for
    the user's location `{location}`, hemisphere `{hemisphere}`, and month
    `{month}`. Detect the most relevant current seasonal event information from
    that input.

    Include:
    - festivals and holidays
    - meteor showers, eclipses, conjunctions, and other celestial events
    - flower blossom seasons
    - bird migration seasons
    - other natural seasonal phenomena

    Filter events according to hemisphere where relevant. For example, blossom or
    seasonal references should match the user's hemisphere and month.

  expected_output: >
    JSON list of detected events.

    Example:
    [
      {
        "event": "Perseid Meteor Shower",
        "type": "celestial",
        "date_range": "Aug 11-Aug 13",
        "location_relevance": "global"
      }
    ]

  agent: seasonal_event_agent

seasonal_event_interpretation_task:
  description: >
    For each detected seasonal event, produce a structured explanation that
    includes the event name, date or date range, origin, associated customs
    where relevant, and the scientific or ecological cause of the event.

    Keep the tone educational, calm, and suitable for a daily digest.

  expected_output: >
    JSON list of enriched seasonal event descriptions.

  agent: seasonal_event_interpretation_agent
  context:
    - seasonal_event_detection_task

seasonal_event_curator_task:
  description: >
    Review the interpreted seasonal events and select the most relevant ones for
    the user's digest.

    Prioritize:
    - events happening now or very soon
    - events strongly relevant to the user's location
    - events with clear cultural or scientific significance
    - variety across celestial, ecological, and festival categories

    Keep the final list concise and suitable for the opening section of the
    email digest.

  expected_output: >
    JSON list of curated seasonal events ready for email insertion.

  agent: seasonal_event_curator_agent
  context:
    - seasonal_event_interpretation_task

photo_ranking_task:
  description: >
    Analyze the provided `photos` input for the location `{location}`. Evaluate
    aesthetic quality based on composition, lighting, clarity, and relevance to
    the city's atmosphere.

    Rank the images and select the top photographs representing local scenes.

  expected_output: >
    JSON list of selected photos ranked by quality.

  agent: photo_analysis_agent

photo_caption_task:
  description: >
    Generate a short factual caption describing the content of each selected
    photograph. The caption should identify the location or scene without adding
    personal opinions or emotional language. Use the already provided photo data
    and do not ask the user for the location again.

  expected_output: >
    One sentence caption for each selected photo.

  agent: photo_analysis_agent
  context:
    - photo_ranking_task

city_landmarks_task:
  description: >
    Review the provided `landmarks` input and select three landmark webcam
    snapshots that best represent the current atmosphere of `{location}`.

    Prioritize:
    - famous landmarks or skyline views
    - waterfront or beach views if they are iconic for the city
    - clear current-view snapshots suitable for an email digest

  expected_output: >
    JSON object containing three landmarks with image URLs and links to live
    streams.

  agent: live_camera_agent

compose_digest_task:
  description: >
    Assemble the final email briefing using the following structure:

    1. Current date
    2. Email title
    3. Seasonal and celestial events
    4. Live city landmarks
    5. User-selected news channels using the provided news input directly
    6. Local street photographs

    Use the provided `news`, `channels`, `interests`, `seasonal_events`,
    `landmarks`, and photo outputs to create a coherent HTML email digest for
    `{location}`.
    The tone must remain factual, neutral, and suitable for a high-quality
    knowledge digest.

  expected_output: >
    Structured digest formatted as HTML for email delivery.

  agent: digest_composer_agent
  context:
    - seasonal_event_curator_task
    - city_landmarks_task
    - photo_caption_task
