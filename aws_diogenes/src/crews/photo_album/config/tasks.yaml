photo_scene_selection_task:
  description: >
    Use the provided `photos` input to choose up to 10 city-scene images for
    `{location}`. Prefer:
    - street scenes
    - night skyline
    - waterfront atmosphere
    - natural urban elements such as rain, trees, clouds, rivers, or coastal air

    Avoid:
    - iconic landmark postcard shots
    - indoor scenes
    - real-estate imagery
    - portraits, food, products, or staged interiors
    - close-up people, visible faces, selfies, or crowd-focused imagery

    Also avoid repeating photos listed in `last_photo_keys` when enough other
    suitable options exist.

    Selection policy:
    - first exhaust images that are clearly tied to `{location}` through their
      text, location field, or other metadata
    - only if there are not enough city-tied images, fill the remaining slots
      with natural fallback scenes such as beach, sunset, waterfront, skyline,
      or weather-driven urban atmosphere
    - never prefer a generic fallback image over a usable city-specific image

  expected_output: >
    JSON list of selected photo items with photo_key, image_url, and source_text.

  guardrail: >
    Return only valid JSON. Keep the selection outdoors, city-scene focused,
    varied, non-repetitive, and use only absolute `https` image URLs that point
    directly to image assets. Select city-specific images first and use scenic
    fallback scenes only when the chosen city does not provide enough good photos.
    Exclude images whose metadata suggests visible faces, portraits, selfies,
    or people-focused composition.

  agent: photo_scene_selector_agent

photo_scene_caption_task:
  description: >
    Add one factual caption to each selected city-scene photo. Captions should
    describe what the reader sees in plain language.

    Rules:
    - keep the caption to a few words or one short sentence
    - aim for 3 to 10 words when possible
    - never output JSON-looking text inside the caption itself
    - do not include metadata keys, braces, or quotation marks
    - do not over-explain the scene

  expected_output: >
    JSON list of selected photo items with photo_key, image_url, and caption.

  guardrail: >
    Return only valid JSON. Every selected photo must keep its key and image_url
    and gain a short factual caption.

  agent: photo_caption_editor_agent
  context:
    - photo_scene_selection_task

photo_album_review_task:
  description: >
    Review the selected and captioned photo set before layout.

    Rules:
    - preserve up to 10 photos
    - keep photos clearly tied to `{location}` first whenever the source set
      contains enough city-specific options
    - only fill remaining slots with scenic fallback images such as beach,
      sunset, skyline, waterfront, clouds, rain, or other outdoor atmosphere
    - never include indoor, real-estate, product, food, portrait, or
      people-focused imagery
    - avoid repeating photos listed in `last_photo_keys` when enough other
      usable options exist
    - keep every caption visible, factual, and short
    - ensure every kept item has `photo_key`, `image_url`, and `caption`
    - reject any image whose metadata suggests visible faces, selfies,
      close-up people, or crowd-first framing

  expected_output: >
    JSON list of reviewed photo items with photo_key, image_url, and caption.

  guardrail: >
    Return only valid JSON. The reviewed set must be city-first, use fallback
    scenic images only to fill gaps, and keep every item renderable with a
    short visible caption.

  agent: photo_album_review_agent
  context:
    - photo_scene_caption_task

photo_album_layout_task:
  description: >
    Format the captioned photo items into email-ready HTML table rows. Keep the
    selected order and return both the rendered HTML and the ordered list of
    photo_keys so the system can remember which images were used.

    Rules:
    - every row must include a real `<img>` tag with the provided `image_url`
    - never output placeholder icons, broken-image symbols, or empty `src`
      values
    - use only the provided `image_url` values
    - keep captions short
    - render every selected image as a visible photo card rather than plain text
    - do not emit Markdown, JSON text, or escaped HTML
    - every rendered card must visibly include its caption text below the image

  expected_output: >
    JSON object with:
    - `photo_keys`: ordered list of selected photo keys
    - `html`: email-ready table rows for the album section

  guardrail: >
    Return only valid JSON. The HTML must contain email-ready table rows and the
    photo_keys list must match the selected images. Every rendered card must
    contain a real image tag with a non-empty absolute `https` source URL.

  agent: photo_album_layout_agent
  context:
    - photo_album_review_task
