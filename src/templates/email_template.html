<html>
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">

<style>

body{
  margin:0;
  padding:0;
  background:{{season_background}};
  font-family:Arial, Helvetica, sans-serif;
}

.wrapper{
  width:100%;
  padding:0;
  background:{{season_background}};
}

.container{
  max-width:720px;
  margin:auto;
  background:#ffffff;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.header{
  background:#111827;
  color:white;
  padding:28px 32px;
}

.header h1{
  margin:0;
  font-size:26px;
  letter-spacing:0.5px;
}

.date{
  font-size:14px;
  opacity:0.75;
  margin-top:4px;
}

.section{
  padding:28px 32px;
  border-bottom:1px solid #ececec;
}

.section-title{
  font-size:20px;
  font-weight:600;
  color:#111827;
  margin-bottom:18px;
}

.event{
  margin-bottom:14px;
  line-height:1.6;
}

.news-item{
  margin-bottom:22px;
}

.news-title{
  font-weight:600;
  font-size:16px;
  color:#111827;
}

.news-description{
  margin-top:8px;
  color:#374151;
  font-size:15px;
  line-height:1.75;
}

.news-group{
  margin-top:22px;
}

.news-group:first-child{
  margin-top:0;
}

.news-group-title{
  display:inline-block;
  margin:0 0 14px 0;
  padding:6px 12px;
  font-size:12px;
  font-weight:700;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:#111827;
  background:#f3f4f6;
  border:1px solid #d1d5db;
  border-radius:999px;
}

.landmark-table{
  width:100%;
  border-collapse:collapse;
}

.landmark-cell{
  width:33.33%;
  vertical-align:top;
  padding-right:10px;
}

.landmark-card{
  border-radius:8px;
  overflow:hidden;
  background:#fafafa;
  border:1px solid #eee;
}

.landmark-card img{
  width:100%;
  display:block;
}

.landmark-name{
  font-size:13px;
  font-weight:600;
  color:#111827;
  padding:10px 10px 4px 10px;
}

.landmark-link{
  font-size:12px;
  padding:0 10px 10px 10px;
}

.photo-card{
  width:100%;
  border-radius:8px;
  overflow:hidden;
  background:#fafafa;
  border:1px solid #eee;
}

.photo-card img{
  max-width:100%;
  width:100%;
  height:auto;
  object-fit:cover;
  display:block;
}

.caption{
  font-size:14px;
  line-height:1.65;
  padding:12px 14px;
  color:#374151;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.footer{
  padding:20px;
  text-align:center;
  font-size:12px;
  color:#9ca3af;
}

.badge{
  display:inline-block;
  background:#e5e7eb;
  color:#374151;
  padding:3px 8px;
  font-size:11px;
  border-radius:4px;
  margin-right:6px;
}

</style>
</head>

<body style="margin:0;padding:0;background:{{season_background}};font-family:Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="{{season_background}}" style="width:100%;border-collapse:collapse;background:{{season_background}};">
  <tr>
    <td align="center" style="padding:32px 12px;background:{{season_background}};">
      <div class="wrapper" style="width:100%;background:{{season_background}};">
        <div class="container" style="max-width:720px;margin:0 auto;background:#ffffff;border-radius:10px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,0.08);">
          <div class="header" style="background:#111827;color:#ffffff;padding:28px 32px;">
            <h1>{{title}}</h1>
            <div class="date">{{date}}</div>
          </div>

          <div class="section" style="padding:28px 32px;border-bottom:1px solid #ececec;">
            <div class="section-title">Flower &amp; Festival</div>
            {{seasonal_events}}
          </div>

          <div class="section" style="padding:28px 32px;border-bottom:1px solid #ececec;">
            <div class="section-title">The world at glance</div>
            {{live_city_landmarks}}
          </div>

          <div class="section" style="padding:28px 32px;border-bottom:1px solid #ececec;">
            <div class="section-title">News Digest</div>
            {{news_sections}}
          </div>

          <div class="section" style="padding:28px 32px;border-bottom:1px solid #ececec;">
            <div class="section-title">{{photo_section_title}}</div>
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;border-collapse:collapse;">
              {{photos}}
            </table>
          </div>

          <div class="footer" style="padding:20px;text-align:center;font-size:12px;color:#9ca3af;">
            Diogenes Sunlight Post<br>
            Generated automatically by AWS Diogenes
          </div>
        </div>
      </div>
    </td>
  </tr>
</table>

</body>
</html>
